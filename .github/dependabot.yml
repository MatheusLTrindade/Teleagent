# Dependabot — npm (root + desktop)

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - enhancement

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - enhancement

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - enhancement
